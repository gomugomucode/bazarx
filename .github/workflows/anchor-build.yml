name: Anchor Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Anchor Build via Docker
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work backpackapp/build:v0.31.0 bash -c "
            git config --global --add safe.directory '*' &&
            rustc --version &&
            cargo --version &&
            solana --version &&
            anchor --version &&
            anchor build
          " 2>&1 | tee build.log

      - name: Post Build Summary
        if: always()
        run: |
          echo "### Anchor Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 150 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify Generated Artifacts
        run: |
          ls -la target/deploy/
          ls -la target/idl/
          test -f target/deploy/bazaarx.so

      - name: Upload IDL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchor-idl
          path: target/idl/bazaarx.json

      - name: Upload Program Binary
        uses: actions/upload-artifact@v4
        with:
          name: anchor-binary
          path: target/deploy/bazaarx.so

      - name: Upload TypeScript Types
        uses: actions/upload-artifact@v4
        with:
          name: anchor-types
          path: target/types/bazaarx.ts

      - name: Commit and Push IDL and Types
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p frontend/idl
          cp target/idl/bazaarx.json frontend/idl/bazaarx.json || true
          git add -f frontend/idl/bazaarx.json Cargo.lock || true
          git commit -m "chore(anchor): sync generated IDL and Cargo.lock from build [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed or nothing to push"
