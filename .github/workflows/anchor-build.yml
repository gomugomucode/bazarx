name: Anchor Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Anchor Build via Docker
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work backpackapp/build:v0.30.1 bash -c "
            git config --global --add safe.directory '*' &&
            cargo generate-lockfile &&
            cargo update -p cpufeatures --precise 0.2.14 &&
            anchor build
          " 2>&1 | tee build.log

      - name: Post Build Summary
        if: always()
        run: |
          echo "### Anchor Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 150 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify Generated Artifacts
        run: |
          ls -la target/deploy/
          ls -la target/idl/
          test -f target/deploy/bazaarx.so

      - name: Upload IDL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchor-idl
          path: target/idl/bazaarx.json

      - name: Upload Program Binary
        uses: actions/upload-artifact@v4
        with:
          name: anchor-binary
          path: target/deploy/bazaarx.so

      - name: Upload TypeScript Types
        uses: actions/upload-artifact@v4
        with:
          name: anchor-types
          path: target/types/bazaarx.ts
