name: Anchor Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Anchor Build via Docker
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work --entrypoint bash coralxyz/anchor:v0.30.1 -c "anchor build"

      - name: Verify Generated Artifacts
        run: |
          ls -la target/deploy/
          ls -la target/idl/

      - name: Upload IDL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchor-idl
          path: target/idl/bazaarx.json

      - name: Upload Program Binary
        uses: actions/upload-artifact@v4
        with:
          name: anchor-binary
          path: target/deploy/bazaarx.so

      - name: Upload TypeScript Types
        uses: actions/upload-artifact@v4
        with:
          name: anchor-types
          path: target/types/bazaarx.ts
